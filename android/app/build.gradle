plugins { id 'com.android.application' }
android {
    namespace 'com.cruzdoodelz.serverstudio'
    compileSdk 35
    defaultConfig {
        applicationId 'com.cruzdoodelz.serverstudio'
        minSdk 26
        targetSdk 35
        versionCode = Integer.parseInt(System.getenv('BUILD') ?: '1')
        versionName '0.12.1-dev'
    }
    signingConfigs {
        debug {
            def stableKey = file('../.signing/debug.keystore')
            if (stableKey.exists()) {
                storeFile = stableKey
                storePassword = 'android'
                keyAlias = 'androiddebugkey'
                keyPassword = 'android'
            }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.work:work-runtime:2.10.1'
}
