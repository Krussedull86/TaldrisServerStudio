name: Promote tested dev to stable
on:
  workflow_dispatch:
    inputs:
      dev_tag:
        description: Exact tested dev tag (dev-v0.5.0.b12)
        required: true
        type: string
      confirm:
        description: Type STABLE to publish this build
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: taldris-stable
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'STABLE'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote the exact tested EXE, without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEV_TAG: ${{ inputs.dev_tag }}
        run: python scripts/release.py promote
