name: Taldris dev
on:
  push:
    branches: [dev]
    paths-ignore: ['**/*.md', 'Preview.png']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: taldris-dev-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - run: python -m unittest discover -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Stamp build metadata
        env:
          BUILD: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
        run: python scripts/release.py stamp
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name TaldrisServerStudio app.py
      - name: Prepare release files and SHA-256
        run: python scripts/release.py package
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release_output/*
          if-no-files-found: error
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release_output
      - name: Publish dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: python scripts/release.py publish-dev
