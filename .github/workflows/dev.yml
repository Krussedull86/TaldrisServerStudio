name: DZSA Tools dev
on:
  push:
    branches: [dev]
    paths-ignore: ['**/*.md', 'Preview.png']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: taldris-dev-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
        if: ${{ !contains(github.event.head_commit.message, '[build only]') }}
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - run: python -m unittest discover -v
        if: ${{ !contains(github.event.head_commit.message, '[build only]') }}
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build server-only telemetry addon
        run: python scripts/build_telemetry.py
      - name: Stamp build metadata
        env:
          BUILD: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
        run: python scripts/release.py stamp
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-data certifi --collect-data discord --hidden-import win32timezone --hidden-import servicemanager --add-data "loot_web;loot_web" --add-data "loot_maps;loot_maps" --collect-all winpty --add-data "assets;assets" --icon assets/dzsa_tools.ico --add-data "dayz_telemetry;dayz_telemetry" --name TaldrisServerStudio app.py
      - name: Smoke test integrated loot editor
        if: ${{ !contains(github.event.head_commit.message, '[build only]') }}
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/TaldrisServerStudio.exe -ArgumentList '--smoke-loot', 'loot-smoke.json' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Loot editor smoke failed" }
      - name: Check loot editor result
        if: ${{ !contains(github.event.head_commit.message, '[build only]') }}
        shell: pwsh
        run: |
          if (!(Test-Path loot-smoke.json)) { throw "Loot smoke report missing" }
          $report = Get-Content loot-smoke.json -Raw | ConvertFrom-Json
          if (!$report.success) { throw ($report | ConvertTo-Json) }
      - name: Smoke test packaged background agent
        if: ${{ !contains(github.event.head_commit.message, '[build only]') }}
        run: python scripts/smoke_agent.py dist/TaldrisServerStudio.exe
      - name: Smoke test packaged self installation and uninstall
        if: ${{ !contains(github.event.head_commit.message, '[build only]') }}
        run: python scripts/smoke_install.py dist/TaldrisServerStudio.exe
      - name: Prepare release files and SHA-256
        run: python scripts/release.py package
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release_output/*
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cds-android-dev-signing-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - name: Build Android development APK
        working-directory: android
        env:
          BUILD: ${{ github.run_number }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Name Android APK
        run: |
          mkdir -p android_release
          cp android/app/build/outputs/apk/debug/app-debug.apk android_release/DZSA-Tools-Android-dev.apk
          cp android_release/DZSA-Tools-Android-dev.apk android_release/CDS-Android-dev.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: android_release/*
          if-no-files-found: error
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release_output
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release_output
      - name: Add Android checksum
        run: python -c "from pathlib import Path; import hashlib; p=Path('release_output/CDS-Android-dev.apk'); f=Path('release_output/SHA256SUMS.txt'); f.write_text(f.read_text()+''.join(hashlib.sha256(a.read_bytes()).hexdigest()+'  '+a.name+'\n' for a in sorted(Path('release_output').glob('*.apk'))))"
      - name: Publish dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: python scripts/release.py publish-dev
